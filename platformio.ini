; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:miniradiozero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip ;Arduino 3.3.9
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = partition_tables/miniradiozero.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.psram_type = qio
board_build.filesystem = littlefs
board_upload.maximum_size = 4194304
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_filters = esp32_exception_decoder, time
extra_scripts = 
    scripts/custom_targets.py
    post:scripts/app_deploy.py
build_flags =
    -D VERSION=1.0.0                           ;no vX.X.X !!!
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
;    -D CORE_DEBUG_LEVEL=2
	-D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/4.0.0.zip
    adafruit/Adafruit NeoPixel@^1.15.5
